<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulico — Command Icons</title>
  <style>
    :root {
      --ink: #0B1727;
      --teal: #14B8A6;
      --paper: #F8FAFC;
      --line: #E2E8F0;
      --muted: #64748B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #EEF2F6;
      color: var(--ink);
      font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 52px 28px 80px; }
    .eyebrow {
      margin: 0 0 10px; color: var(--teal); font-size: 11px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: clamp(34px, 5vw, 56px); letter-spacing: -.05em; }
    .intro { max-width: 680px; margin: 0 0 30px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .panel {
      padding: 22px; border: 1px solid var(--line); border-radius: 24px; background: #fff;
    }
    .panel.dark { margin-top: 18px; border-color: var(--ink); background: var(--ink); }
    .panel h2 { margin: 0 0 16px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .panel.dark h2 { color: #94A3B8; }
    .grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;
    }
    .item {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 14px 10px; border: 1px solid var(--line); border-radius: 16px;
    }
    .panel.dark .item { border-color: rgba(248,250,252,.14); }
    .sizes { display: flex; align-items: flex-end; gap: 14px; min-height: 68px; }
    .sizes img { display: block; }
    .sizes .s64 { width: 64px; height: 64px; }
    .sizes .s32 { width: 32px; height: 32px; }
    .sizes .s16 { width: 16px; height: 16px; }
    .name {
      color: var(--muted); font-size: 11px; font-family: "Cascadia Code", Consolas, monospace;
      text-align: center; word-break: break-word;
    }
    .panel.dark .name { color: #94A3B8; }
    .legend { display: flex; gap: 16px; margin-bottom: 18px; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Bulico / Command Icons</p>
    <h1>Function icon set</h1>
    <p class="intro">
      11 个功能图标，统一使用深色圆角底板、白色线稿和 Teal 强调。每个图标同时展示 64 px（SVG）、32 px 和 16 px（实际 PNG）。
    </p>

    <div class="legend">
      <span><i style="background:#0B1727"></i> Ink tile</span>
      <span><i style="background:#F8FAFC;border:1px solid #E2E8F0"></i> White line</span>
      <span><i style="background:#14B8A6"></i> Teal accent</span>
    </div>

    <section class="panel" aria-label="Icons on light background">
      <h2>Light ribbon</h2>
      <div class="grid" id="light-grid"></div>
    </section>

    <section class="panel dark" aria-label="Icons on dark background">
      <h2>Dark ribbon</h2>
      <div class="grid" id="dark-grid"></div>
    </section>
  </div>

  <script>
    const icons = [
      "grid_wall", "wall_beam", "wall_beam_floor", "room_floor",
      "elevation_grid", "mullion", "door_window_mark",
      "same_type", "category_filter", "fine_filter", "about"
    ];

    function card(name) {
      return `
        <div class="item">
          <div class="sizes">
            <img class="s64" src="src/${name}.svg" alt="${name}">
            <img class="s32" src="${name}_32.png" alt="${name} 32">
            <img class="s16" src="${name}_16.png" alt="${name} 16">
          </div>
          <div class="name">${name}</div>
        </div>`;
    }

    document.getElementById('light-grid').innerHTML = icons.map(card).join('');
    document.getElementById('dark-grid').innerHTML = icons.map(card).join('');
  </script>
</body>
</html>
